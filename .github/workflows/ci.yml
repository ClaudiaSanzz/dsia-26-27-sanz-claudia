name: CI Proyecto I

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias Parte A
        working-directory: Proyectos/Proyecto_i/Parte_A_ventas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests Parte A
        working-directory: Proyectos/Proyecto_i/Parte_A_ventas
        run: |
          python -m pytest --cov=ventas --cov-report=term-missing --cov-fail-under=60

      - name: Instalar dependencias Parte B
        working-directory: Proyectos/Proyecto_i/Parte_B_cafe
        run: |
          pip install -r requirements.txt

      - name: Tests Parte B
        working-directory: Proyectos/Proyecto_i/Parte_B_cafe
        run: |
          python -m pytest --cov=cafeterias --cov-report=term-missing --cov-fail-under=60